<!doctype html>
<html lang="en">
    <head>
        <title>Playback</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./main.css" />
        <script type="module" src="/01-playback.ts"></script>
    </head>

    <body>
        <p><a href="/">Examples</a></p>
        <h1>Playback</h1>
        <p>A state is a marker of the file: play it once or in a loop, at any speed, either way.</p>
        <div class="controls">
            <select id="icon"></select>
            <select id="state"></select>
            <button id="play">Play</button>
            <label><input type="checkbox" id="loop" /> loop</label>
            <label><input type="checkbox" id="reverse" /> reverse</label>
            <label
                >speed <input type="range" id="speed" min="0.25" max="3" step="0.25" value="1"
            /></label>
        </div>
        <div id="stage"></div>
        <p class="stats" id="stats"></p>
    </body>
</html>
